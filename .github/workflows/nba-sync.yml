# NBA dashboard data: BallDontLie (GOAT) -> Supabase nba_* tables.
# Writes to the database only (no Redis, no repo commits).
# The incremental sync runs every 15 minutes from the Vercel cron /api/cron/sync-nba-bdl
# (GitHub skipped most scheduled runs). This workflow is for manual runs: any jobs/seasons,
# e.g. a full backfill.
name: NBA Sync

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Comma-separated jobs (blank = all)'
        required: false
        default: ''
      seasons:
        description: 'Comma-separated season start years (blank = current)'
        required: false
        default: ''
      full:
        description: 'Whole seasons instead of the last few days'
        required: false
        type: boolean
        default: false
      max_games:
        description: 'Play-by-play games per run'
        required: false
        default: '1500'

concurrency:
  group: nba-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync from BallDontLie
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ -n "${{ inputs.jobs }}" ] && ARGS="$ARGS --jobs=${{ inputs.jobs }}"
            [ -n "${{ inputs.seasons }}" ] && ARGS="$ARGS --seasons=${{ inputs.seasons }}"
            [ "${{ inputs.full }}" = "true" ] && ARGS="$ARGS --full"
            ARGS="$ARGS --max-games=${{ inputs.max_games }}"
          fi
          npx tsx scripts/sync-nba-bdl.ts $ARGS
