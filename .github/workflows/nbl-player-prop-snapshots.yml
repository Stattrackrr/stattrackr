# Snapshot PulseScore NBL player O/U + milestone lines (Sportsbet / TAB)
# before books take markets down, then ingest live odds into production
# Redis so /props and combined stay current without a Vercel data deploy.
name: NBL Player Prop Snapshots

on:
  schedule:
    # Every 2 hours — NBL props usually post 4–8h before tip.
    - cron: '20 */2 * * *'
  workflow_dispatch:

concurrency:
  group: nbl-player-prop-snapshots
  cancel-in-progress: false

env:
  TZ: Australia/Brisbane

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: false

      - name: Check ingest secrets
        id: check
        run: |
          PULSE=false
          PROD=false
          if [ -n "${{ secrets.PULSESCORE_API_KEY }}" ]; then
            PULSE=true
          fi
          if [ -n "${{ secrets.PROD_URL }}" ] && [ -n "${{ secrets.CRON_SECRET }}" ]; then
            PROD=true
          fi
          echo "pulse=${PULSE}" >> $GITHUB_OUTPUT
          echo "prod=${PROD}" >> $GITHUB_OUTPUT
          if [ "$PULSE" != "true" ] && [ "$PROD" != "true" ]; then
            echo "Need PULSESCORE_API_KEY or PROD_URL+CRON_SECRET"
            exit 1
          fi

      - name: Setup Node.js
        if: steps.check.outputs.pulse == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check.outputs.pulse == 'true'
        run: npm ci

      - name: Snapshot PulseScore NBL player lines
        if: steps.check.outputs.pulse == 'true'
        env:
          PULSESCORE_API_KEY: ${{ secrets.PULSESCORE_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: npm run snapshot:nbl:player-props

      - name: Commit player-prop snapshots
        if: steps.check.outputs.pulse == 'true'
        run: |
          bash scripts/ci-commit-data-files.sh "chore(data): NBL PulseScore player-prop snapshots [skip ci]" \
            "data/nbl-model/cache/player-prop-lines" \
            "data/nbl-model/cache/player-props-list.json"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Ingest NBL odds into production props
        if: steps.check.outputs.prod == 'true'
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/ci-curl-prod-cron.sh /api/nbl/odds/refresh 280
