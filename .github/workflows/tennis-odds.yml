# Pull The Odds API tennis catalog, rebuild DVP boards, and bake ranks onto props.
# Hits production /api/cron/refresh-tennis-odds which also builds DVP.
# GitHub delays */30 schedules by hours; use explicit slots so ingest actually runs.
name: Tennis Odds Ingest

on:
  schedule:
    - cron: '8 * * * *'
    - cron: '23 * * * *'
    - cron: '38 * * * *'
    - cron: '53 * * * *'
  workflow_dispatch:

concurrency:
  group: tennis-odds-ingest
  cancel-in-progress: false

env:
  TZ: Australia/Sydney

jobs:
  refresh_odds:
    runs-on: ubuntu-latest
    # Route maxDuration is 300s; allow one transport retry after a hang.
    timeout-minutes: 15
    steps:
      - name: Check PROD_URL and CRON_SECRET
        id: check
        run: |
          if [ -z "${{ secrets.PROD_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "PROD_URL or CRON_SECRET not set; skipping tennis odds ingest"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout curl helper
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/ci-curl-prod-cron.sh
          sparse-checkout-cone-mode: false

      - name: Refresh tennis odds and bake DVP
        if: steps.check.outputs.configured == 'true'
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/ci-curl-prod-cron.sh /api/cron/refresh-tennis-odds?force=1 280 2
