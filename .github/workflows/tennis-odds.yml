# Pull The Odds API tennis catalog onto production so ATP/WTA props stay populated.
# Hits production /api/cron/refresh-tennis-odds.
name: Tennis Odds Ingest

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: tennis-odds-ingest
  cancel-in-progress: false

env:
  TZ: Australia/Sydney

jobs:
  refresh_odds:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check PROD_URL and CRON_SECRET
        id: check
        run: |
          if [ -z "${{ secrets.PROD_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "PROD_URL or CRON_SECRET not set; skipping tennis odds ingest"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Refresh tennis odds snapshots
        if: steps.check.outputs.configured == 'true'
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          PROD="${PROD_URL%/}"
          echo "Refreshing tennis odds snapshots..."
          RESPONSE=$(curl -sS -L --location-trusted --max-time 200 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --write-out "\nHTTP_STATUS:%{http_code}" \
            "${PROD}/api/cron/refresh-tennis-odds?force=1") || true
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "Response ($HTTP_STATUS): $BODY"
          OK=$(node -e "try { const j = JSON.parse(process.argv[1]); process.stdout.write(j.success === true ? 'true' : 'false'); } catch { process.stdout.write('false'); }" "$BODY")
          if [ "$HTTP_STATUS" != "200" ] || [ "$OK" != "true" ]; then
            echo "Tennis odds ingest failed (HTTP ${HTTP_STATUS:-unknown})"
            exit 1
          fi
          echo "Tennis odds ingest ok"
