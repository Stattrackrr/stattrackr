# Incremental tennis ingest: fetch recently finished matches and append
# them onto Redis player-log shards. Historical games already in cache stay put.
name: Tennis Process Stats

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

concurrency:
  group: tennis-process-stats
  cancel-in-progress: false

env:
  TZ: Australia/Sydney

jobs:
  process_stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check PROD_URL and CRON_SECRET
        id: check
        run: |
          if [ -z "${{ secrets.PROD_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "PROD_URL or CRON_SECRET not set; skipping tennis ingest"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Refresh tennis overlay and Redis player logs
        if: steps.check.outputs.configured == 'true'
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          PROD="${PROD_URL%/}"
          case "$PROD" in
            http://*) PROD="https://${PROD#http://}" ;;
          esac
          EFFECTIVE=$(curl -sS -o /dev/null -w "%{url_effective}" -L --max-time 20 "${PROD}/" || true)
          ORIGIN=$(printf '%s' "$EFFECTIVE" | sed -E 's#(https?://[^/]+).*#\1#')
          case "$ORIGIN" in
            http://*|https://*) ;;
            *) ORIGIN="$PROD" ;;
          esac
          URL="${ORIGIN}/api/cron/refresh-tennis-cache?step=overlay"
          echo "Canonical cron URL: $URL"
          echo "Refreshing tennis finished-match logs (append new games only)..."

          call_cron() {
            local target="$1"
            local timeout="$2"
            local hdr body
            hdr=$(mktemp)
            body=$(mktemp)
            HTTP_STATUS=$(curl -sS -D "$hdr" -o "$body" --max-time "$timeout" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "X-Cron-Secret: ${CRON_SECRET}" \
              -H "Accept: application/json" \
              -w "%{http_code}" \
              "$target" || true)
            HTTP_STATUS="${HTTP_STATUS:-000}"
            BODY=$(cat "$body")
            LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); print}' "$hdr" | tr -d '\r' | tail -1)
            rm -f "$hdr" "$body"
          }

          call_cron "$URL" 180
          if [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ] || [ "$HTTP_STATUS" = "307" ] || [ "$HTTP_STATUS" = "308" ]; then
            echo "Edge redirect $HTTP_STATUS -> $LOCATION"
            case "$LOCATION" in
              http://*|https://*) TARGET="$LOCATION" ;;
              /*) TARGET="${ORIGIN}${LOCATION}" ;;
              *) TARGET="${ORIGIN}/${LOCATION}" ;;
            esac
            call_cron "$TARGET" 180
          fi
          echo "Response ($HTTP_STATUS): $BODY"
          OK=$(node -e "try { const j = JSON.parse(process.argv[1]); process.stdout.write(j.success === true ? 'true' : 'false'); } catch { process.stdout.write('false'); }" "$BODY")
          if [ "$HTTP_STATUS" != "200" ] || [ "$OK" != "true" ]; then
            echo "Tennis ingest failed (HTTP ${HTTP_STATUS:-unknown})"
            exit 1
          fi
          echo "Tennis ingest ok"

      - name: Rebuild tennis tournament DVP
        if: steps.check.outputs.configured == 'true'
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          PROD="${PROD_URL%/}"
          case "$PROD" in
            http://*) PROD="https://${PROD#http://}" ;;
          esac
          EFFECTIVE=$(curl -sS -o /dev/null -w "%{url_effective}" -L --max-time 20 "${PROD}/" || true)
          ORIGIN=$(printf '%s' "$EFFECTIVE" | sed -E 's#(https?://[^/]+).*#\1#')
          case "$ORIGIN" in
            http://*|https://*) ;;
            *) ORIGIN="$PROD" ;;
          esac
          URL="${ORIGIN}/api/cron/refresh-tennis-dvp"
          echo "Canonical cron URL: $URL"
          echo "Building live/upcoming tennis DVP..."

          call_cron() {
            local target="$1"
            local timeout="$2"
            local hdr body
            hdr=$(mktemp)
            body=$(mktemp)
            HTTP_STATUS=$(curl -sS -D "$hdr" -o "$body" --max-time "$timeout" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "X-Cron-Secret: ${CRON_SECRET}" \
              -H "Accept: application/json" \
              -w "%{http_code}" \
              "$target" || true)
            HTTP_STATUS="${HTTP_STATUS:-000}"
            BODY=$(cat "$body")
            LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); print}' "$hdr" | tr -d '\r' | tail -1)
            rm -f "$hdr" "$body"
          }

          call_cron "$URL" 150
          if [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ] || [ "$HTTP_STATUS" = "307" ] || [ "$HTTP_STATUS" = "308" ]; then
            echo "Edge redirect $HTTP_STATUS -> $LOCATION"
            case "$LOCATION" in
              http://*|https://*) TARGET="$LOCATION" ;;
              /*) TARGET="${ORIGIN}${LOCATION}" ;;
              *) TARGET="${ORIGIN}/${LOCATION}" ;;
            esac
            call_cron "$TARGET" 150
          fi
          echo "Response ($HTTP_STATUS): $BODY"
          OK=$(node -e "try { const j = JSON.parse(process.argv[1]); process.stdout.write(j.success === true ? 'true' : 'false'); } catch { process.stdout.write('false'); }" "$BODY")
          if [ "$HTTP_STATUS" != "200" ] || [ "$OK" != "true" ]; then
            echo "Tennis DVP rebuild failed (HTTP ${HTTP_STATUS:-unknown})"
            exit 1
          fi
          echo "Tennis DVP ok"
