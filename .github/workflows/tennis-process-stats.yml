# Incremental tennis match ingest: finished ATP/WTA singles from the last 16 days.
# Hits production /api/cron/refresh-tennis-cache (sharedCache overlay + upcoming warm).
name: Tennis Process Stats

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

concurrency:
  group: tennis-process-stats
  cancel-in-progress: false

env:
  TZ: Australia/Sydney

jobs:
  process_stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check PROD_URL and CRON_SECRET
        id: check
        run: |
          if [ -z "${{ secrets.PROD_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "PROD_URL or CRON_SECRET not set; skipping tennis ingest"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Refresh tennis match overlay
        if: steps.check.outputs.configured == 'true'
        run: |
          echo "Refreshing tennis finished-match overlay (last 16 days)..."
          RESPONSE=$(curl -s -X GET "${{ secrets.PROD_URL }}/api/cron/refresh-tennis-cache" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -L --max-time 150 \
            --write-out "\nHTTP_STATUS:%{http_code}" 2>&1) || true
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "Response ($HTTP_STATUS): $BODY"
          OK=$(node -e "try { const j = JSON.parse(process.argv[1]); process.stdout.write(j.success === true ? 'true' : 'false'); } catch { process.stdout.write('false'); }" "$BODY")
          if [ "$HTTP_STATUS" != "200" ] || [ "$OK" != "true" ]; then
            echo "Tennis ingest failed (HTTP ${HTTP_STATUS:-unknown})"
            exit 1
          fi
          echo "Tennis ingest ok"
