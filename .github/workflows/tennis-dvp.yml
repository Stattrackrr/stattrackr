# Rebuild live/upcoming tennis DVP boards and refresh props-page ranks.
# Redis player logs only — do not hydrate the overlay blob.
name: Tennis DVP

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: tennis-dvp
  cancel-in-progress: false

env:
  TZ: Australia/Sydney

jobs:
  build_dvp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check PROD_URL and CRON_SECRET
        id: check
        run: |
          if [ -z "${{ secrets.PROD_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "PROD_URL or CRON_SECRET not set; skipping tennis DVP"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Rebuild tennis tournament DVP
        if: steps.check.outputs.configured == 'true'
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          PROD="${PROD_URL%/}"
          echo "Building live/upcoming tennis DVP..."
          RESPONSE=$(curl -sS -L --location-trusted --max-time 150 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --write-out "\nHTTP_STATUS:%{http_code}" \
            "${PROD}/api/cron/refresh-tennis-dvp") || true
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "Response ($HTTP_STATUS): $BODY"
          OK=$(node -e "try { const j = JSON.parse(process.argv[1]); process.stdout.write(j.success === true ? 'true' : 'false'); } catch { process.stdout.write('false'); }" "$BODY")
          if [ "$HTTP_STATUS" != "200" ] || [ "$OK" != "true" ]; then
            echo "Tennis DVP rebuild failed (HTTP ${HTTP_STATUS:-unknown})"
            exit 1
          fi
          echo "Tennis DVP ok"
