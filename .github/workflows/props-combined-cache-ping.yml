# Keep /api/props/combined Redis snapshot warm between heavier ingest runs.
# Writes tennis list + combined caches. Page GET stays cache-only.
name: Props Combined Cache Ping

on:
  schedule:
    - cron: '5 * * * *'
    - cron: '25 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch:

concurrency:
  group: props-combined-cache-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # Route maxDuration is 300s; allow a timeout retry without killing the job.
    timeout-minutes: 15
    steps:
      - name: Checkout curl helper
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/ci-curl-prod-cron.sh
          sparse-checkout-cone-mode: false

      - name: Fill combined props snapshot
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/ci-curl-prod-cron.sh /api/cron/refresh-combined-props?sync=1 280 2
