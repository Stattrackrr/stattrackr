[project]
name = "nbl-engine"
version = "0.1.0"
description = "NBL Props Analysis Engine: evidence-first prop analysis over StatTrackr's stored NBL data and odds."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nbl_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
